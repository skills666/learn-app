# App version. Hand-maintained on purpose: the version number must change only
# when we say so, not every time a build runs on somebody's laptop.
#
# Bump VERSION_CODE on every release. It must be larger than the previous one
# (VERSION_NAME is only what humans read).
#
# 版本号来源（由 app/build.gradle 读取，缺文件会直接报错）。
# 为什么不用构建时间派生（旧实现 versionCode=yyMMddHH、versionName=1.0.yyyyMMddHHmm）：
#   同一小时内多次构建会拿到相同的 versionCode；时钟回拨会让号码变小（侧载被系统拒装）；
#   且每次构建 versionName 都不同，破坏构建缓存与可复现性。
# 注意：历史 APK 的 versionCode 是 yyMMddHH 形状的大数（如 26100913），新方案从 1 开始，
#   因此它会小于已装的那一版 —— 只影响"覆盖安装"，卸载重装即可，不影响任何功能。
VERSION_CODE=1
VERSION_NAME=1.0.0
